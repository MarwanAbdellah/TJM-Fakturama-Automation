[project]
name = "image2cash"
version = "0.1.0"
description = "Fakturama Image-to-Cash: order image -> saved Order + linked, paid Invoice via UI Automation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "indra-ocr>=1.1.2",
    "jaydebeapi>=1.2.3",
    "pillow>=10",
    "pydantic>=2.12",
    "pywinauto>=0.6.9",
    "streamlit>=1.40",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]

[project.scripts]
image2cash = "image2cash.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image2cash"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905", "UP042"]  # `l` = OCR Line; zip lengths are equal by construction; str Enum is intended

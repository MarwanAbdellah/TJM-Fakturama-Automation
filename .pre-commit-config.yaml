# Install once: uv run pre-commit install --install-hooks -t pre-commit -t pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1500]  # evidence screenshots are ~150 kB each
        exclude: ^demo/  # the demo video (about 7 MB) is the one big file on purpose
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: unit tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

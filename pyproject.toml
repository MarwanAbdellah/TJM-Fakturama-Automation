[project]
name = "image2cash"
version = "0.1.0"
description = "Fakturama Image-to-Cash: order image -> saved Order + linked, paid Invoice via UI Automation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "indra-ocr>=1.1.2",
    "jaydebeapi>=1.2.3",
    "pillow>=10",
    "pydantic>=2.12",
    "pywinauto>=0.6.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]

[project.scripts]
image2cash = "image2cash.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image2cash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
